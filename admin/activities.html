        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.6);
        z-index: 2000;
        align-items: center;
        justify-content: center;

    .modal-content {

        border-radius: 10px;
        padding: 30px;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;

    .close-modal {
        border: none;
        background: transparent;
        font-size: 25px;
        cursor: pointer;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        font-size: 13px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
        font-family: inherit;
        box-sizing: border-box;
    }

    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #10243a;
    }

    .submit-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 5px;
        background: #10243a;
        color: white;
        font-weight: 600;
        cursor: pointer;
    }

    .submit-btn:hover {
        opacity: .9;
    }

    .status-message {

    .status-message.error {
        display: block;
        background: #f8e2e2;
        color: #9b2222;
    }

    @media (max-width: 1000px) {

            align-items: flex-start;

<script>


// ==========================================
// LOAD ACTIVITIES
// ==========================================

async function loadActivities() {

    const container =
        document.getElementById("activitiesList");


    try {

        const response =
            await fetch("/api/activities");


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to load activities."
            );

        }


        if (
            !data.activities ||
            data.activities.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-state">

                    <i class="fas fa-calendar"></i>

                    <h3>No activities yet</h3>

                    <p>
                        Add your first choir activity.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        data.activities.forEach(activity => {

            const card =
                document.createElement("article");


            card.className =
                "activity-card";


            card.innerHTML = `

                <div class="activity-icon">

                    <i class="fas fa-calendar-day"></i>

                </div>


                <h3>
                    ${escapeHTML(activity.title)}
                </h3>


                ${
                    activity.description
                    ? `
                        <p class="activity-description">
                            ${escapeHTML(
                                activity.description
                            )}
                        </p>
                    `
                    : ""
                }


                <div class="activity-details">


                    ${
                        activity.event_date
                        ? `
                            <div class="activity-detail">

                                <i class="fas fa-calendar"></i>

                                <span>
                                    ${escapeHTML(
                                        formatDate(
                                            activity.event_date
                                        )
                                    )}
                                </span>

                            </div>
                        `
                        : ""
                    }


                    ${
                        activity.event_time
                        ? `
                            <div class="activity-detail">

                                <i class="fas fa-clock"></i>

                                <span>
                                    ${escapeHTML(
                                        formatTime(
                                            activity.event_time
                                        )
                                    )}
                                </span>

                            </div>
                        `
                        : ""
                    }


                    ${
                        activity.location
                        ? `
                            <div class="activity-detail">

                                <i class="fas fa-location-dot"></i>

                                <span>
                                    ${escapeHTML(
                                        activity.location
                                    )}
                                </span>

                            </div>
                        `
                        : ""
                    }


                </div>


                <div class="activity-actions">

                    <button
                        type="button"
                        class="delete-btn"
                        onclick="deleteActivity(${activity.id})">

                        <i class="fas fa-trash"></i>

                        Delete

                    </button>

                </div>

            `;


            container.appendChild(card);

        });


    } catch (error) {

        console.error(
            "Load activities error:",
            error
        );


        container.innerHTML = `

            <div class="empty-state">

                <i class="fas fa-triangle-exclamation"></i>

                <h3>Unable to load activities</h3>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}



// ==========================================
// ADD ACTIVITY
// ==========================================

document
    .getElementById("activityForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const activity = {

                title:
                    document
                        .getElementById("title")
                        .value
                        .trim(),

                description:
                    document
                        .getElementById("description")
                        .value
                        .trim(),

                event_date:
                    document
                        .getElementById("event_date")
                        .value,

                event_time:
                    document
                        .getElementById("event_time")
                        .value,

                location:
                    document
                        .getElementById("location")
                        .value
                        .trim()

            };


            if (!activity.title) {

                showMessage(
                    "Please enter an activity title.",
                    "error"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/activities",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(activity)

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Failed to add activity."
                    );

                }


                showMessage(
                    "Activity added successfully!",
                    "success"
                );


                document
                    .getElementById("activityForm")
                    .reset();


                closeModal();


                await loadActivities();


            } catch (error) {

                console.error(
                    "Add activity error:",
                    error
                );


                showMessage(
                    error.message,
                    "error"
                );

            }

        }
    );



// ==========================================
// DELETE ACTIVITY
// ==========================================

async function deleteActivity(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this activity?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/activities/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to delete activity."
            );

        }


        showMessage(
            "Activity deleted successfully.",
            "success"
        );


        await loadActivities();


    } catch (error) {

        console.error(
            "Delete activity error:",
            error
        );


        showMessage(
            error.message,
            "error"
        );

    }

}



// ==========================================
// DATE FORMAT
// ==========================================

function formatDate(value) {

    if (!value) {
        return "";
    }


    const parts =
        value.split("-");


    if (parts.length === 3) {

        return `${parts[2]}/${parts[1]}/${parts[0]}`;

    }


    return value;

}



// ==========================================
// TIME FORMAT
// ==========================================

function formatTime(value) {

    if (!value) {
        return "";
    }


    const parts =
        value.split(":");


    if (parts.length < 2) {
        return value;
    }


    let hour =
        parseInt(parts[0], 10);


    const minute =
        parts[1];


    const period =
        hour >= 12 ? "PM" : "AM";


    hour =
        hour % 12 || 12;


    return `${hour}:${minute} ${period}`;

}



// ==========================================
// OPEN MODAL
// ==========================================

function openModal() {

    document
        .getElementById("activityModal")
        .classList.add("active");

}



// ==========================================
// CLOSE MODAL
// ==========================================

function closeModal() {

    document
        .getElementById("activityModal")
        .classList.remove("active");

}



// ==========================================
// CLOSE WHEN CLICKING OUTSIDE
// ==========================================

document
    .getElementById("activityModal")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeModal();

            }

        }
    );



// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(message, type) {

    const element =
        document.getElementById("statusMessage");


    element.textContent =
        message;


    element.className =
        `status-message ${type}`;


    setTimeout(
        () => {

            element.className =
                "status-message";

        },
        4000
    );

}



// ==========================================
// SECURITY
// ==========================================

function escapeHTML(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}



// ==========================================
// INITIAL LOAD
// ==========================================

loadActivities();

</script>
