</div>

<script>


// ===============================
// LOAD MEMBERS
// ===============================

async function loadMembers() {

    const table =
        document.getElementById(
            "membersTable"
        );


    try {

        const response =
            await fetch("/api/members");


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                "Unable to load members."
            );

        }


        if (
            !data.members ||
            data.members.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td colspan="6"
                        class="empty-members">

                        <i class="fas fa-users"></i>

                        <br><br>

                        No members have been added yet.

                    </td>

                </tr>

            `;

            return;

        }


        table.innerHTML = "";


        data.members.forEach(member => {


            const row =
                document.createElement("tr");


            const photo =
                member.photo &&
                member.photo.length > 5 &&
                member.photo !== ":"

                ? member.photo

                : "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80";


            row.innerHTML = `

                <td>

                    <img
                        src="${photo}"
                        alt="${escapeHTML(member.name)}"
                        class="member-photo">

                </td>


                <td>

                    <strong>
                        ${escapeHTML(member.name)}
                    </strong>

                </td>


                <td>

                    ${escapeHTML(
                        member.position ||
                        "Member"
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        member.phone ||
                        "-"
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        member.email ||
                        "-"
                    )}

                </td>


                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteMember(${member.id})">

                        <i class="fas fa-trash"></i>

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(row);

        });


    } catch (error) {

        console.error(error);


        table.innerHTML = `

            <tr>

                <td colspan="6"
                    class="empty-members">

                    Unable to load members.

                </td>

            </tr>

        `;

    }

}



// ===============================
// ADD MEMBER
// ===============================

document.getElementById(
    "memberForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const member = {

            name:
                document.getElementById(
                    "name"
                ).value.trim(),

            position:
                document.getElementById(
                    "position"
                ).value.trim(),

            phone:
                document.getElementById(
                    "phone"
                ).value.trim(),

            email:
                document.getElementById(
                    "email"
                ).value.trim(),

            photo:
                document.getElementById(
                    "photo"
                ).value.trim()

        };


        try {

            const response =
                await fetch(
                    "/api/members",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(member)

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.message ||
                    "Failed to add member."
                );

            }


            showMessage(
                "Member added successfully!",
                "success"
            );


            document.getElementById(
                "memberForm"
            ).reset();


            closeModal();


            loadMembers();


        } catch (error) {

            console.error(error);


            showMessage(
                error.message,
                "error"
            );

        }

    }
);



// ===============================
// DELETE MEMBER
// ===============================

async function deleteMember(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this member?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/members/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "Failed to delete member."
            );

        }


        showMessage(
            "Member deleted successfully.",
            "success"
        );


        loadMembers();


    } catch (error) {

        console.error(error);


        showMessage(
            error.message,
            "error"
        );

    }

}



// ===============================
// MODAL
// ===============================

function openModal() {

    document
        .getElementById("memberModal")
        .classList.add("active");

}


function closeModal() {

    document
        .getElementById("memberModal")
        .classList.remove("active");

}



// Close modal when clicking outside

document
    .getElementById("memberModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );



// ===============================
// MESSAGE
// ===============================

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "statusMessage"
        );


    element.textContent =
        message;


    element.className =
        `status-message ${type}`;


    setTimeout(
        () => {

            element.className =
                "status-message";

        },
        4000
    );

}



// ===============================
// SECURITY
// ===============================

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}



// ===============================
// INITIAL LOAD
// ===============================

loadMembers();

</script>
