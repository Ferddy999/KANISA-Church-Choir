<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gallery | Church Choir Admin</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .add-btn {
            background: #071d35;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .gallery-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(240px, 1fr));

            gap: 20px;

        }

        .gallery-card {

            background: white;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 3px 10px rgba(0,0,0,.08);

        }

        .gallery-card img {

            width: 100%;

            height: 190px;

            object-fit: cover;

        }

        .gallery-info {

            padding: 15px;

        }

        .gallery-info h3 {

            margin-bottom: 7px;

        }

        .delete-btn {

            margin-top: 12px;

            background: #b42318;

            color: white;

            border: none;

            padding: 8px 13px;

            border-radius: 5px;

            cursor: pointer;

        }

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.55);

            align-items: center;

            justify-content: center;

        }

        .modal-content {

            background: white;

            width: 90%;

            max-width: 500px;

            padding: 30px;

            border-radius: 10px;

        }

        .modal-content input,
        .modal-content textarea {

            width: 100%;

            padding: 12px;

            margin: 7px 0 15px;

            border: 1px solid #ddd;

            border-radius: 5px;

        }

        .modal-content input[type="file"] {

            padding: 8px;

        }

        .modal-content textarea {

            min-height: 90px;

            resize: vertical;

        }

        .save-btn {

            background: #071d35;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 5px;

            cursor: pointer;

        }

        .close-btn {

            float: right;

            border: none;

            background: none;

            font-size: 22px;

            cursor: pointer;

        }

    </style>

</head>


<body>


<div class="dashboard">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="dashboard-logo">✝</div>

            <div>

                <h2>Grace Fellowship</h2>

                <p>Choir Admin</p>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="/admin/dashboard.html">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </a>

            <a href="/admin/members.html">
                <i class="fas fa-users"></i>
                Members
            </a>

            <a href="/admin/songs.html">
                <i class="fas fa-music"></i>
                Songs
            </a>

            <a href="/admin/activities.html">
                <i class="fas fa-calendar"></i>
                Activities
            </a>

            <a href="/admin/services.html">
                <i class="fas fa-church"></i>
                Services
            </a>

            <a href="/admin/gallery.html"
               class="active">
                <i class="fas fa-images"></i>
                Gallery
            </a>

        </nav>


        <a href="/admin/login.html"
           class="logout">

            Logout

        </a>

    </aside>


    <!-- MAIN -->

    <main class="main-content">


        <div class="page-header">

            <div>

                <h1>Choir Gallery</h1>

                <p>
                    Upload and manage choir photographs.
                </p>

            </div>


            <button class="add-btn"
                    onclick="openModal()">

                + Upload Image

            </button>

        </div>


        <section>

            <div
                class="gallery-grid"
                id="galleryList">

                Loading gallery...

            </div>

        </section>


    </main>

</div>


<!-- UPLOAD MODAL -->

<div class="modal"
     id="galleryModal">

    <div class="modal-content">


        <button
            class="close-btn"
            onclick="closeModal()">

            ×

        </button>


        <h2>Upload Choir Image</h2>

        <br>


        <form
            id="galleryForm"
            enctype="multipart/form-data">


            <label>
                Image
            </label>


            <input
                type="file"
                id="image"
                name="image"
                accept="image/png,image/jpeg,image/webp"
                required
            >


            <label>
                Title
            </label>


            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Sunday Worship"
            >


            <label>
                Description
            </label>


            <textarea
                id="description"
                name="description"
                placeholder="Describe the photograph">
            </textarea>


            <button
                type="submit"
                class="save-btn">

                Upload Image

            </button>


        </form>

    </div>

</div>


<script>


async function loadGallery() {

    try {

        const response =
            await fetch("/api/gallery");


        const data =
            await response.json();


        const list =
            document.getElementById("galleryList");


        if (!data.success) {

            list.innerHTML =
                "Failed to load gallery.";

            return;

        }


        if (data.gallery.length === 0) {

            list.innerHTML =
                "No images uploaded yet.";

            return;

        }


        list.innerHTML = "";


        data.gallery.forEach(item => {


            const card =
                document.createElement("div");


            card.className =
                "gallery-card";


            card.innerHTML = `

                <img
                    src="${item.image}"
                    alt="${item.title || "Choir image"}"
                >

                <div class="gallery-info">

                    <h3>
                        ${item.title || "Choir Image"}
                    </h3>

                    <p>
                        ${item.description || ""}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteImage(${item.id})">

                        Delete

                    </button>

                </div>

            `;


            list.appendChild(card);

        });


    } catch (error) {

        console.error(error);

    }

}


function openModal() {

    document.getElementById("galleryModal")
        .style.display = "flex";

}


function closeModal() {

    document.getElementById("galleryModal")
        .style.display = "none";

}


document
    .getElementById("galleryForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const formData =
                new FormData(this);


            try {


                const response =
                    await fetch(
                        "/api/gallery",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    alert(
                        "Image uploaded successfully!"
                    );


                    this.reset();

                    closeModal();

                    loadGallery();


                } else {

                    alert(data.message);

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Upload failed."
                );

            }

        }
    );


async function deleteImage(id) {


    if (!confirm(
        "Delete this image?"
    )) {

        return;

    }


    const response =
        await fetch(
            `/api/gallery/${id}`,
            {
                method: "DELETE"
            }
        );


    const data =
        await response.json();


    if (data.success) {

        loadGallery();

    } else {

        alert(data.message);

    }

}


loadGallery();

</script>


</body>

</html>
